name: Windows

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Windows", os: "windows-2022", target: "windows" }

    env:
      # Uses the visual studio installed on the runner, since the internal google toolchain is not available outside chromium.
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

      # Setting DEPOT_TOOLS_UPDATE to 0 here would skip the bootstrap that installs git.bat and the bundled python, and depot tools would then fail on its own internal git calls.

    steps:
      - uses: actions/checkout@v4

      # The depot tools bootstrap drops a python3.bat into a directory that ends up ahead of this one in PATH.
      # Every step below calls this interpreter by path instead of relying on the name python3.
      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade PIP
        run: ${{ steps.python.outputs.python-path }} -m pip install --upgrade pip setuptools wheel

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.0"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: "1.12.1"

      - name: Verify
        run: |
          ${{ steps.python.outputs.python-path }} --version
          cmake --version
          ninja --version

      - name: Python requirements
        run: ${{ steps.python.outputs.python-path }} -m pip install -r requirements.txt --user

      - name: Depot tools
        run: ${{ steps.python.outputs.python-path }} make.py build-depot-tools

      - name: Environment
        run: echo "$env:GITHUB_WORKSPACE\build\depot-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: PDFium
        run: ${{ steps.python.outputs.python-path }} make.py build-pdfium-${{ matrix.config.target }}

      - name: Patch
        run: ${{ steps.python.outputs.python-path }} make.py patch-${{ matrix.config.target }}

      - name: Patch - Check
        run: ${{ steps.python.outputs.python-path }} make.py patch-${{ matrix.config.target }}

      - name: Build
        run: ${{ steps.python.outputs.python-path }} make.py build-${{ matrix.config.target }}

      - name: Install
        run: ${{ steps.python.outputs.python-path }} make.py install-${{ matrix.config.target }}

      - name: Test
        run: ${{ steps.python.outputs.python-path }} make.py test-${{ matrix.config.target }}

      - name: Archive
        run: ${{ steps.python.outputs.python-path }} make.py archive-${{ matrix.config.target }}

      - name: Save
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.config.target }}
          path: ${{ matrix.config.target }}.zip

  # MinGW is not a build target, it is a consumer of the same artifact, so it
  # verifies the published library instead of compiling pdfium again.
  mingw:
    name: MinGW ${{ matrix.config.arch }}
    runs-on: ${{ matrix.config.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: "windows-2022", arch: "x64", msystem: "MINGW64", package: "mingw-w64-x86_64-gcc" }
          - { os: "windows-11-arm", arch: "arm64", msystem: "CLANGARM64", package: "mingw-w64-clang-aarch64-toolchain" }

    steps:
      - uses: actions/checkout@v4

      - name: Load
        uses: actions/download-artifact@v4
        with:
          name: artifact-windows

      - name: Extract
        run: Expand-Archive -Path windows.zip -DestinationPath .

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.config.msystem }}
          update: false
          install: ${{ matrix.config.package }}

      - name: Link the sample against the dll
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -I release/include sample/src/main.cpp release/lib/${{ matrix.config.arch }}/pdfium.dll -o sample.exe
          cp release/lib/${{ matrix.config.arch }}/pdfium.dll .
          cp sample/assets/f1.pdf .
          ./sample.exe

  # The cross compiled arm64 library is only proven by running it, which needs a
  # machine of that architecture.
  arm64:
    name: ARM64
    runs-on: windows-11-arm
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Load
        uses: actions/download-artifact@v4
        with:
          name: artifact-windows

      - name: Extract
        run: |
          New-Item -ItemType Directory -Force -Path build\windows
          Expand-Archive -Path windows.zip -DestinationPath build\windows

      - name: Generate the sample
        run: cmake -S sample -B sample/build -DPDFIUM_CONFIG=release

      - name: Build the sample
        run: cmake --build sample/build --config Release

      - name: Run the sample
        run: |
          Copy-Item sample\assets\f1.pdf sample\build\
          cd sample\build
          .\sample.exe

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, mingw, arm64]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Load
        uses: actions/download-artifact@v4
        with:
          name: artifact-windows
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: windows.zip
          asset_name: windows.zip
          asset_content_type: application/zip
