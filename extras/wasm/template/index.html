    <script>
        // The saved theme is applied before paint to avoid a flash of the wrong scheme.
        (function () {
            const saved = localStorage.getItem('pdfviewer-theme');

            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>

    <style>
        :root {
            --viewer-bg: #525659;
            --toolbar-bg: #323639;
            --toolbar-fg: #f1f1f1;
            --toolbar-border: rgba(255, 255, 255, 0.12);
            --page-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Start screen. */
        #startScreen {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bulma-scheme-main-bis);
            overflow-y: auto;
        }

        .theme-switch {
            position: absolute;
            top: 1rem;
            right: 1rem;
            margin-bottom: 0;
        }

        .start-card {
            width: 100%;
            max-width: 560px;
        }

        .dropzone {
            border: 2px dashed var(--bulma-border);
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            transition: border-color .2s, background-color .2s;
            cursor: pointer;
            background: var(--bulma-scheme-main);
            color: var(--bulma-text);
        }

        .dropzone:hover {
            border-color: var(--bulma-link);
        }

        .dropzone-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        /* Viewer. */
        #viewer {
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 0;
        }

        #toolbar {
            display: flex;
            align-items: center;
            gap: .4rem .6rem;
            padding: .4rem .6rem;
            background: var(--toolbar-bg);
            color: var(--toolbar-fg);
            border-bottom: 1px solid var(--toolbar-border);
            flex-wrap: wrap;
        }

        .toolbar-left,
        .toolbar-center,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        /* Left and right grow equally so the page indicator stays centered. */
        .toolbar-left {
            flex: 1 1 0;
            min-width: 0;
        }

        .toolbar-right {
            flex: 1 1 0;
            justify-content: flex-end;
        }

        .toolbar-center {
            flex: 0 0 auto;
        }

        .toolbar-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40vw;
        }

        .tool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2rem;
            height: 2rem;
            padding: 0 .5rem;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--toolbar-fg);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color .15s;
        }

        .tool-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.14);
        }

        .tool-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tool-btn:disabled {
            opacity: .4;
            cursor: default;
        }

        .tool-logo {
            padding: 0 .25rem;
        }

        .tool-logo img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: block;
        }

        .page-indicator {
            display: flex;
            align-items: center;
            gap: .35rem;
            font-variant-numeric: tabular-nums;
        }

        .page-indicator input {
            width: 3.2rem;
            height: 2rem;
            text-align: center;
            border: 1px solid var(--toolbar-border);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.25);
            color: var(--toolbar-fg);
        }

        .zoom-level {
            min-width: 3.5rem;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        #pagesContainer {
            position: relative;
            flex: 1;
            overflow: auto;
            background: var(--viewer-bg);
            padding: 1.5rem 0;
            -webkit-overflow-scrolling: touch;
        }

        .page {
            position: relative;
            margin: 0 auto 1.25rem auto;
            background: #fff;
            box-shadow: var(--page-shadow);
        }

        .page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .page-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b9b9b9;
        }

        .page-spinner {
            width: 2.5rem;
            height: 2.5rem;
            border: 3px solid #e3e3e3;
            border-top-color: #9aa0a6;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Loading overlay. */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: var(--bulma-scheme-main);
            z-index: 50;
            transition: opacity .25s;
        }

        #loadingOverlay.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Drag overlay. */
        #dropOverlay {
            position: fixed;
            inset: 0;
            z-index: 55;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(50, 54, 57, 0.82);
            color: #fff;
            font-size: 1.4rem;
            font-weight: 600;
        }

        #dropOverlay.is-active {
            display: flex;
        }

        .drop-hint {
            border: 3px dashed rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 3rem 4rem;
            text-align: center;
        }

        /* Toast. */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translateX(-50%) translateY(2rem);
            z-index: 60;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            pointer-events: none;
        }

        #toast.is-active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Debug console. */
        #debugConsole {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            width: min(420px, 90vw);
            max-height: 40vh;
            overflow: auto;
            z-index: 40;
            display: none;
            font-size: .8rem;
        }

        #debugConsoleContent p {
            margin: 0 0 .25rem 0;
        }

        @media (max-width: 640px) {
            .toolbar-title {
                display: none;
            }

            #pagesContainer {
                padding: .75rem 0;
            }

            .tool-btn {
                min-width: 1.8rem;
                height: 1.8rem;
                padding: 0 .3rem;
            }

            .zoom-level {
                min-width: 2.6rem;
                font-size: .85rem;
            }

            .page-indicator input {
                width: 2.6rem;
                height: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Start screen. -->
        <section id="startScreen">
            <div class="theme-switch buttons has-addons">
                <button data-theme-choice="system" class="button is-small" title="Follow system theme">System</button>
                <button data-theme-choice="light" class="button is-small" title="Light theme">Light</button>
                <button data-theme-choice="dark" class="button is-small" title="Dark theme">Dark</button>
            </div>

            <div class="start-card">
                <h1 class="title is-4 has-text-centered">PDF Viewer</h1>
                <p class="subtitle is-6 has-text-centered has-text-grey">
                    View PDF files locally in your browser. Nothing is uploaded.
                </p>

                <div id="dropzone" class="dropzone">
                    <img class="dropzone-logo" src="logo.png?v={pdfium-branch}" alt="PDF Viewer">
                    <p class="mt-3"><strong>Drop a PDF here</strong> or click to browse</p>
                    <input id="fileInput" type="file" accept="application/pdf" hidden>
                </div>

                <div class="field has-addons mt-5">
                    <div class="control is-expanded">
                        <input id="urlInput" class="input" type="text" placeholder="Or paste a public PDF URL">
                    </div>
                    <div class="control">
                        <button id="urlButton" class="button is-link">Open</button>
                    </div>
                </div>

                <p class="has-text-centered has-text-grey is-size-7 mt-6">
                    Powered by the open source
                    <a target="_blank" href="https://github.com/paulocoutinhox/pdfium-lib">PDF Viewer</a>
                    project, running entirely on the client side. PDFium branch "{pdfium-branch}".
                </p>
            </div>
        </section>

        <!-- Viewer. -->
        <section id="viewer">
            <div id="toolbar">
                <div class="toolbar-left">
                    <button id="openButton" class="tool-btn tool-logo" title="Open another file">
                        <img src="logo.png?v={pdfium-branch}" alt="PDF Viewer">
                    </button>
                    <span id="fileTitle" class="toolbar-title"></span>
                </div>

                <div class="toolbar-center page-indicator">
                    <button id="prevPage" class="tool-btn" title="Previous page">‹</button>
                    <input id="pageInput" type="text" inputmode="numeric" value="1">
                    <span>/</span>
                    <span id="pageCount">0</span>
                    <button id="nextPage" class="tool-btn" title="Next page">›</button>
                </div>

                <div class="toolbar-right">
                    <button id="zoomOut" class="tool-btn" title="Zoom out">−</button>
                    <span id="zoomLevel" class="zoom-level">100%</span>
                    <button id="zoomIn" class="tool-btn" title="Zoom in">+</button>
                    <button id="fitWidth" class="tool-btn" title="Fit width">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4" />
                        </svg>
                    </button>
                    <button id="downloadButton" class="tool-btn" title="Download">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="pagesContainer"></div>
        </section>
    </div>

    <!-- Loading overlay. -->
    <div id="loadingOverlay">
        <div class="page-spinner"></div>
        <p id="loadingText" class="has-text-grey">Loading engine…</p>
    </div>

    <!-- Drag overlay. -->
    <div id="dropOverlay">
        <div class="drop-hint">
            <img class="dropzone-logo" src="logo.png?v={pdfium-branch}" alt="PDF Viewer">
            <p class="mt-3">Drop the PDF to open it</p>
        </div>
    </div>

    <!-- Toast. -->
    <div id="toast" class="notification is-danger"></div>

    <!-- Debug console. -->
    <div id="debugConsole" class="box">
        <p class="has-text-weight-bold mb-2">Debug console</p>
        <div id="debugConsoleContent"></div>
    </div>

    <script>
        // The engine version is replaced at build time and busts the cache of the worker and of every asset it loads.
        const PDFIUM_VERSION = "{pdfium-branch}";

        // Viewer tuning.
        const MIN_ZOOM = 0.25;
        const MAX_ZOOM = 5.0;
        const ZOOM_STEP = 0.2;
        const RENDER_MARGIN_RATIO = 1.5;
        const MAX_PIXEL_DIMENSION = 4096;
        const PREVIEW_MAX_WIDTH = 320;
        const PREVIEW_CACHE_LIMIT = 60;
        const PIXEL_RATIO = Math.min(window.devicePixelRatio || 1, 2);

        let worker = null;

        // The document holds the page geometry and the source blob, never the pdfium handles.
        let activeDocument = null;
        let zoom = 1.0;
        let fitMode = true;
        let currentPage = 1;
        let scrollRaf = null;

        // Renders in flight are tagged with a generation so that a zoom can invalidate them.
        let generation = 0;
        let openRequest = null;

        // Previews are kept for the whole document, while full renders live only while on screen.
        const previewCache = new Map();
        const requestedPreviews = new Set();
        const requestedFull = new Map();
        const fullPages = new Set();

        // Dom references.
        const dom = {};

        // Resolves once the wasm engine is ready to accept calls.
        let markEngineReady;
        const engineReady = new Promise((resolve) => { markEngineReady = resolve; });

        function startWorker() {
            worker = new Worker('pdfium-worker.js?v=' + encodeURIComponent(PDFIUM_VERSION));
            worker.onmessage = (event) => onWorkerMessage(event.data);

            worker.onerror = (event) => {
                setLoading(false);
                showError("the render engine failed to start");
                log("Worker error: " + (event.message || "unknown"));
            };
        }

        function onWorkerMessage(message) {
            switch (message.type) {
                case 'ready':
                    markEngineReady();
                    setLoading(false);
                    log("Engine ready");
                    break;

                case 'opened':
                    onDocumentOpened(message);
                    break;

                case 'openError':
                    onDocumentFailed(message);
                    break;

                case 'rendered':
                    onPageRendered(message);
                    break;

                case 'renderError':
                    log("Page " + (message.index + 1) + " failed: " + message.message);
                    break;
            }
        }

        // Opens a document, moving the buffer to the worker and keeping the blob here so downloads cost no extra memory.
        function openDocument(buffer, name, blob) {
            return new Promise((resolve, reject) => {
                closeDocument();

                openRequest = { resolve, reject, name, blob };
                worker.postMessage({ type: 'open', buffer }, [buffer]);
            });
        }

        function onDocumentOpened(message) {
            const request = openRequest;
            openRequest = null;

            if (!request) {
                return;
            }

            activeDocument = {
                name: request.name,
                blob: request.blob,
                pageCount: message.pageCount,
                sizes: message.sizes,
            };

            log('Opened "' + request.name + '" with ' + message.pageCount + ' page(s)');

            // The viewer is shown first so that the container has a real width to measure against.
            showViewer(request.name, message.pageCount);
            buildPages();
            fitWidth();

            request.resolve();
        }

        function onDocumentFailed(message) {
            const request = openRequest;

            // A protected document is retried with a password, reusing the bytes the worker holds.
            if (message.needsPassword) {
                const entered = window.prompt("This PDF is password protected. Enter the password:");

                if (entered !== null) {
                    worker.postMessage({ type: 'open', password: entered });
                    return;
                }
            }

            openRequest = null;

            if (request) {
                request.reject(new Error(message.message));
            }
        }

        function closeDocument() {
            if (!activeDocument) {
                return;
            }

            worker.postMessage({ type: 'close' });
            discardCaches();
            activeDocument = null;
        }

        function discardCaches() {
            for (const preview of previewCache.values()) {
                releasePaintable(preview);
            }

            previewCache.clear();
            requestedPreviews.clear();
            requestedFull.clear();
            fullPages.clear();
            generation++;
        }

        // Returns the scale a page is rendered at, capped so that huge pages never blow up the bitmap.
        function renderScale(size) {
            return Math.min(zoom * PIXEL_RATIO, MAX_PIXEL_DIMENSION / Math.max(size.width, size.height));
        }

        // Builds one placeholder per page, sized by its aspect ratio and not rendered yet.
        function buildPages() {
            dom.pagesContainer.innerHTML = "";

            // A new document always starts at the top, never at the previous scroll position.
            dom.pagesContainer.scrollTop = 0;
            currentPage = 1;

            for (let index = 0; index < activeDocument.pageCount; index++) {
                const page = document.createElement('div');
                page.className = "page";
                page.dataset.index = index;
                page.appendChild(buildPlaceholder());

                dom.pagesContainer.appendChild(page);
                applyPageSize(page, activeDocument.sizes[index]);
            }
        }

        function buildPlaceholder() {
            const placeholder = document.createElement('div');
            placeholder.className = "page-placeholder";
            placeholder.innerHTML = '<div class="page-spinner"></div>';

            return placeholder;
        }

        function applyPageSize(page, size) {
            page.style.width = Math.round(size.width * zoom) + "px";
            page.style.height = Math.round(size.height * zoom) + "px";
        }

        // Requests the pages near the viewport and drops the others back to a preview.
        function refreshVisiblePages() {
            const container = dom.pagesContainer;
            const margin = container.clientHeight * RENDER_MARGIN_RATIO;
            const top = container.scrollTop - margin;
            const bottom = container.scrollTop + container.clientHeight + margin;
            const center = container.scrollTop + container.clientHeight / 2;

            for (const page of container.children) {
                const index = Number(page.dataset.index);
                const visible = page.offsetTop + page.offsetHeight >= top && page.offsetTop <= bottom;

                if (visible) {
                    requestPage(index, Math.abs(page.offsetTop + page.offsetHeight / 2 - center));
                } else if (fullPages.has(index) || requestedFull.has(index)) {
                    releasePage(page, index);
                }
            }

            updateCurrentPage();
        }

        // Requests a coarse preview once, then the sharp render for the current zoom.
        function requestPage(index, priority) {
            const size = activeDocument.sizes[index];
            const scale = renderScale(size);
            const previewScale = Math.min(scale, PREVIEW_MAX_WIDTH / size.width);

            if (requestedPreviews.has(index)) {
                // A page on screen is in use, so it must not be the next preview evicted.
                touchPreview(index);
            } else {
                requestedPreviews.add(index);
                worker.postMessage({ type: 'render', index, scale: previewScale, quality: 'preview', gen: generation, priority });
            }

            if (requestedFull.get(index) !== scale) {
                requestedFull.set(index, scale);
                worker.postMessage({ type: 'render', index, scale, quality: 'full', gen: generation, priority });
            }
        }

        function onPageRendered(message) {
            const image = toPaintable(message);

            // A render that finished after a zoom or a close is no longer wanted.
            if (message.gen < generation || !activeDocument) {
                releasePaintable(image);
                return;
            }

            const page = dom.pagesContainer.children[message.index];

            if (!page) {
                releasePaintable(image);
                return;
            }

            if (message.quality === 'preview') {
                cachePreview(message.index, image);

                // A sharp render already on screen must not be replaced by the preview.
                if (!fullPages.has(message.index)) {
                    paint(page, image, false);
                }

                return;
            }

            // The page may have scrolled out of range while this render was in flight, and releasePage already dropped the request.
            if (requestedFull.get(message.index) !== message.scale) {
                releasePaintable(image);
                return;
            }

            paint(page, image, true);
            fullPages.add(message.index);
        }

        // Caches a preview, keeping only the most recently used ones since a long document adds up.
        function cachePreview(index, image) {
            releasePaintable(previewCache.get(index));
            previewCache.delete(index);
            previewCache.set(index, image);

            while (previewCache.size > PREVIEW_CACHE_LIMIT) {
                const oldest = previewCache.keys().next().value;

                releasePaintable(previewCache.get(oldest));
                previewCache.delete(oldest);
                requestedPreviews.delete(oldest);
            }
        }

        // Marks a preview as recently used, by moving its entry to the end.
        function touchPreview(index) {
            const image = previewCache.get(index);

            if (!image) {
                return null;
            }

            previewCache.delete(index);
            previewCache.set(index, image);

            return image;
        }

        function toPaintable(message) {
            if (message.bitmap) {
                return { bitmap: message.bitmap };
            }

            return { imageData: new ImageData(new Uint8ClampedArray(message.pixels), message.width, message.height) };
        }

        function releasePaintable(image) {
            if (image && image.bitmap) {
                image.bitmap.close();
            }
        }

        // Paints an image into a page, where consume hands the bitmap to the canvas without a copy and empties it.
        // Only one shot full renders consume, while cached previews are drawn.
        function paint(page, image, consume) {
            const canvas = document.createElement('canvas');

            if (image.bitmap && consume) {
                canvas.width = image.bitmap.width;
                canvas.height = image.bitmap.height;
                canvas.getContext('bitmaprenderer').transferFromImageBitmap(image.bitmap);
            } else if (image.bitmap) {
                canvas.width = image.bitmap.width;
                canvas.height = image.bitmap.height;
                canvas.getContext('2d').drawImage(image.bitmap, 0, 0);
            } else {
                canvas.width = image.imageData.width;
                canvas.height = image.imageData.height;
                canvas.getContext('2d').putImageData(image.imageData, 0, 0);
            }

            page.replaceChildren(canvas);
        }

        // Drops the sharp render of a page and leaves its preview on screen.
        function releasePage(page, index) {
            const hadFull = fullPages.delete(index);

            // A render still queued for a page nobody is looking at is wasted work.
            if (requestedFull.delete(index)) {
                worker.postMessage({ type: 'drop', index });
            }

            if (!hadFull) {
                return;
            }

            const preview = touchPreview(index);

            if (preview) {
                paint(page, preview, false);
            } else {
                page.replaceChildren(buildPlaceholder());
            }
        }

        // Points the page indicator at the page closest to the viewport center.
        function updateCurrentPage() {
            const container = dom.pagesContainer;
            const center = container.scrollTop + container.clientHeight / 2;

            let closest = 1;
            let smallest = Infinity;

            for (const page of container.children) {
                const pageCenter = page.offsetTop + page.offsetHeight / 2;
                const distance = Math.abs(pageCenter - center);

                if (distance < smallest) {
                    smallest = distance;
                    closest = Number(page.dataset.index) + 1;
                }
            }

            currentPage = closest;
            dom.pageInput.value = String(closest);
            dom.prevPage.disabled = closest <= 1;
            dom.nextPage.disabled = closest >= activeDocument.pageCount;
        }

        function scrollToPage(number) {
            const clamped = Math.min(Math.max(number, 1), activeDocument.pageCount);
            const page = dom.pagesContainer.children[clamped - 1];

            if (page) {
                dom.pagesContainer.scrollTo({ top: page.offsetTop - 16, behavior: 'smooth' });
            }
        }

        // Applies a zoom, laying every page out again and re-rendering what is visible.
        // The canvases already on screen are left in place and stretched by css, so a page never flashes back to a spinner.
        function applyZoom(nextZoom) {
            zoom = Math.min(Math.max(nextZoom, MIN_ZOOM), MAX_ZOOM);
            dom.zoomLevel.textContent = Math.round(zoom * 100) + "%";

            for (const page of dom.pagesContainer.children) {
                applyPageSize(page, activeDocument.sizes[Number(page.dataset.index)]);
            }

            // Everything still queued at the old scale is dropped before the new one is requested.
            generation++;
            requestedFull.clear();
            worker.postMessage({ type: 'cancel', gen: generation });

            refreshVisiblePages();
        }

        // Applies a zoom asked by the user, which turns off automatic width fitting.
        function setZoom(nextZoom) {
            fitMode = false;
            applyZoom(nextZoom);
        }

        // Fits the widest page, so that a document of mixed sizes never overflows horizontally.
        function fitWidth() {
            const available = dom.pagesContainer.clientWidth - 24;

            let widest = 0;

            for (const size of activeDocument.sizes) {
                widest = Math.max(widest, size.width);
            }

            fitMode = true;
            applyZoom(available / widest);
        }

        // File sources.
        async function openFromFile(file) {
            try {
                setLoading(true, "Reading file…");
                log('Reading file "' + file.name + '"');

                await engineReady;
                await openDocument(await file.arrayBuffer(), file.name, file);

                setLoading(false);
            } catch (error) {
                setLoading(false);
                showError(error.message);
            }
        }

        async function openFromURL(url) {
            try {
                setLoading(true, "Downloading…");
                log("Downloading " + url);

                await engineReady;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("could not download the file");
                }

                const blob = await response.blob();
                const name = decodeURIComponent(url.split('/').pop() || "document.pdf");
                await openDocument(await blob.arrayBuffer(), name, blob);

                setLoading(false);
            } catch (error) {
                setLoading(false);
                showError(error.message);
            }
        }

        function downloadActive() {
            if (!activeDocument) {
                return;
            }

            const link = document.createElement('a');

            link.href = URL.createObjectURL(activeDocument.blob);
            link.download = activeDocument.name;
            link.click();

            URL.revokeObjectURL(link.href);
        }

        // Interface state.
        function showViewer(name, pageCount) {
            dom.fileTitle.textContent = name;
            dom.pageCount.textContent = String(pageCount);
            dom.startScreen.style.display = "none";
            dom.viewer.style.display = "flex";

            document.title = name + " - PDF Viewer";
            zoom = 1.0;
            dom.zoomLevel.textContent = "100%";
        }

        function showStart() {
            closeDocument();
            dom.viewer.style.display = "none";
            dom.startScreen.style.display = "flex";
            document.title = "PDFium PDF Viewer";
        }

        function setLoading(active, text) {
            if (!dom.loadingOverlay) {
                return;
            }

            if (text) {
                dom.loadingText.textContent = text;
            }

            dom.loadingOverlay.classList.toggle('is-hidden', !active);
        }

        let toastTimer = null;

        function showError(message) {
            log("Error: " + message);

            dom.toast.textContent = message;
            dom.toast.classList.add('is-active');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => dom.toast.classList.remove('is-active'), 4000);
        }

        function log(message) {
            if (!dom.debugConsoleContent) {
                return;
            }

            const line = document.createElement('p');
            line.textContent = "➔ [" + new Date().toLocaleTimeString() + "] " + message;
            dom.debugConsoleContent.prepend(line);
        }

        // Binds every event.
        function bindEvents() {
            dom.dropzone.onclick = () => dom.fileInput.click();

            dom.fileInput.onchange = () => {
                const file = dom.fileInput.files[0];

                // The value is reset so that picking the same file again still fires the change event.
                dom.fileInput.value = "";

                if (file) {
                    openFromFile(file);
                }
            };

            dom.urlButton.onclick = () => dom.urlInput.value && openFromURL(dom.urlInput.value.trim());

            dom.urlInput.onkeydown = (event) => {
                if (event.key === 'Enter') {
                    dom.urlButton.click();
                }
            };

            dom.openButton.onclick = showStart;
            dom.downloadButton.onclick = downloadActive;

            dom.prevPage.onclick = () => scrollToPage(currentPage - 1);
            dom.nextPage.onclick = () => scrollToPage(currentPage + 1);
            dom.pageInput.onchange = () => scrollToPage(Number(dom.pageInput.value));

            dom.zoomIn.onclick = () => setZoom(zoom + ZOOM_STEP);
            dom.zoomOut.onclick = () => setZoom(zoom - ZOOM_STEP);
            dom.fitWidth.onclick = fitWidth;

            dom.pagesContainer.onscroll = onScroll;

            // Ctrl and wheel zoom together, like a native viewer.
            dom.pagesContainer.addEventListener('wheel', (event) => {
                if (event.ctrlKey) {
                    event.preventDefault();
                    setZoom(zoom + (event.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
                }
            }, { passive: false });

            // Resizing and rotating keep fitting to width, unless the user zoomed manually.
            window.onresize = () => {
                if (!activeDocument) {
                    return;
                }

                if (fitMode) {
                    fitWidth();
                } else {
                    refreshVisiblePages();
                }
            };
            document.onkeydown = onKeyDown;

            bindDragAndDrop();
        }

        function onScroll() {
            if (scrollRaf) {
                return;
            }

            scrollRaf = requestAnimationFrame(() => {
                scrollRaf = null;
                refreshVisiblePages();
            });
        }

        function onKeyDown(event) {
            if (!activeDocument || dom.viewer.style.display === "none") {
                return;
            }

            const actions = {
                ArrowLeft: () => scrollToPage(currentPage - 1),
                ArrowRight: () => scrollToPage(currentPage + 1),
                Home: () => scrollToPage(1),
                End: () => scrollToPage(activeDocument.pageCount),
            };

            if (actions[event.key]) {
                actions[event.key]();
                event.preventDefault();
            }
        }

        // Accepts a pdf dropped anywhere on the window, even while a document is open.
        function bindDragAndDrop() {
            const stop = (event) => {
                event.preventDefault();
                event.stopPropagation();
            };

            const hasFiles = (event) => Array.from(event.dataTransfer?.types || []).includes('Files');

            // A counter keeps the overlay stable across nested dragenter and dragleave events.
            let dragDepth = 0;

            window.addEventListener('dragenter', (event) => {
                if (!hasFiles(event)) {
                    return;
                }

                stop(event);
                dragDepth++;
                dom.dropOverlay.classList.add('is-active');
            });

            window.addEventListener('dragover', (event) => hasFiles(event) && stop(event));

            window.addEventListener('dragleave', (event) => {
                if (!hasFiles(event)) {
                    return;
                }

                stop(event);
                dragDepth = Math.max(0, dragDepth - 1);

                if (dragDepth === 0) {
                    dom.dropOverlay.classList.remove('is-active');
                }
            });

            window.addEventListener('drop', (event) => {
                if (!hasFiles(event)) {
                    return;
                }

                stop(event);
                dragDepth = 0;
                dom.dropOverlay.classList.remove('is-active');

                const file = Array.from(event.dataTransfer.files).find((f) => f.type === 'application/pdf');

                if (file) {
                    openFromFile(file);
                } else {
                    showError("Please drop a PDF file.");
                }
            });
        }

        // Applies a theme, where system follows prefers-color-scheme while light and dark force one.
        function applyTheme(choice) {
            if (choice === 'system') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', choice);
            }

            localStorage.setItem('pdfviewer-theme', choice);

            for (const button of document.querySelectorAll('[data-theme-choice]')) {
                button.classList.toggle('is-link', button.dataset.themeChoice === choice);
            }
        }

        function setupTheme() {
            const saved = localStorage.getItem('pdfviewer-theme') || 'system';

            applyTheme(saved);

            for (const button of document.querySelectorAll('[data-theme-choice]')) {
                button.onclick = () => applyTheme(button.dataset.themeChoice);
            }
        }

        function getUrlParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        // Applies the optional url parameters, which are url, title and debug.
        function applyUrlParams() {
            const url = getUrlParam("url");
            const title = getUrlParam("title");

            if (getUrlParam("debug") === "1") {
                dom.debugConsole.style.display = "block";
            }

            if (title) {
                document.title = decodeURIComponent(title) + " - PDF Viewer";
            }

            if (url) {
                openFromURL(decodeURIComponent(url));
            }
        }

        function init() {
            const ids = [
                'startScreen', 'viewer', 'dropzone', 'fileInput', 'urlInput', 'urlButton',
                'openButton', 'fileTitle', 'pagesContainer', 'prevPage', 'nextPage', 'pageInput',
                'pageCount', 'zoomOut', 'zoomIn', 'zoomLevel', 'fitWidth', 'downloadButton',
                'loadingOverlay', 'loadingText', 'dropOverlay', 'toast', 'debugConsole', 'debugConsoleContent',
            ];

            for (const id of ids) {
                dom[id] = document.getElementById(id);
            }

            if (!('WebAssembly' in window) || !('Worker' in window)) {
                setLoading(false);
                showError("Your browser does not support WebAssembly workers.");
                return;
            }

            setupTheme();
            startWorker();
            bindEvents();
            applyUrlParams();
        }

        // The script runs at the end of the body, so the dom is already available.
        init();
    </script>
